<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Amber · Cobalt · Jade</title>
  <style>
    :root {
      /* Amber — oklch seed #FFB72B → C 0.162 H 78° */
      --amber-50:  #FFE667; /* oklch(0.970 0.162 78) */
      --amber-100: #FFCF4D; /* oklch(0.900 0.162 78) */
      --amber-150: #FFB82D; /* oklch(0.830 0.162 78) */
      --amber-200: #E8A200; /* oklch(0.760 0.162 78) */
      --amber-250: #D18B00; /* oklch(0.690 0.162 78) */
      --amber-300: #BA7600; /* oklch(0.620 0.162 78) */
      --amber-350: #A46100; /* oklch(0.550 0.162 78) */
      --amber-400: #8D4C00; /* oklch(0.480 0.162 78) */
      --amber-450: #783700; /* oklch(0.410 0.162 78) */
      --amber-500: #622200; /* oklch(0.340 0.162 78) */
      --amber-550: #4D0B00; /* oklch(0.270 0.162 78) */
      --amber-600: #390000; /* oklch(0.200 0.162 78) */

      /* Cobalt — oklch seed #004B9B → C 0.146 H 256.2° */
      --cobalt-50:  #B3F9FF; /* oklch(0.970 0.146 256.2) */
      --cobalt-100: #9CE1FF; /* oklch(0.900 0.146 256.2) */
      --cobalt-150: #86CAFF; /* oklch(0.830 0.146 256.2) */
      --cobalt-200: #70B3FF; /* oklch(0.760 0.146 256.2) */
      --cobalt-250: #5B9CF4; /* oklch(0.690 0.146 256.2) */
      --cobalt-300: #4686DC; /* oklch(0.620 0.146 256.2) */
      --cobalt-350: #3071C5; /* oklch(0.550 0.146 256.2) */
      --cobalt-400: #195CAD; /* oklch(0.480 0.146 256.2) */
      --cobalt-450: #004797; /* oklch(0.410 0.146 256.2) */
      --cobalt-500: #003281; /* oklch(0.340 0.146 256.2) */
      --cobalt-550: #001D6B; /* oklch(0.270 0.146 256.2) */
      --cobalt-600: #000255; /* oklch(0.200 0.146 256.2) */

      /* Jade — oklch seed #008F39 → C 0.163 H 148.3° */
      --jade-50:  #A3FFB6; /* oklch(0.970 0.163 148.3) */
      --jade-100: #8BFB9F; /* oklch(0.900 0.163 148.3) */
      --jade-150: #73E489; /* oklch(0.830 0.163 148.3) */
      --jade-200: #5BCD74; /* oklch(0.760 0.163 148.3) */
      --jade-250: #42B65E; /* oklch(0.690 0.163 148.3) */
      --jade-300: #26A049; /* oklch(0.620 0.163 148.3) */
      --jade-350: #008A34; /* oklch(0.550 0.163 148.3) */
      --jade-400: #00741D; /* oklch(0.480 0.163 148.3) */
      --jade-450: #006000; /* oklch(0.410 0.163 148.3) */
      --jade-500: #004B00; /* oklch(0.340 0.163 148.3) */
      --jade-550: #003800; /* oklch(0.270 0.163 148.3) */
      --jade-600: #002400; /* oklch(0.200 0.163 148.3) */

      --bg:      #f9f9f8;
      --surface: #ffffff;
      --text:    #1a1a1a;
      --muted:   #6b6b6b;
      --border:  #e5e5e3;
      --code-bg: #1a1a1a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      padding: 56px 0 40px;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    header p {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .badge svg {
      width: 14px;
      height: 14px;
    }

    .ramp-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 28px 24px;
      margin-bottom: 24px;
    }

    .ramp-section h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
      text-transform: capitalize;
    }

    .ramp-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 18px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
    }

    @media (max-width: 700px) {
      .swatch-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    .swatch {
      cursor: pointer;
      border-radius: 10px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      position: relative;
    }

    .swatch:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      z-index: 2;
    }

    .swatch:active { transform: scale(0.97); }

    .swatch:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    .swatch .step-num {
      font-size: 0.72rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .swatch .hex-val {
      font-size: 0.58rem;
      opacity: 0.75;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .swatch .oklch-val {
      font-size: 0.48rem;
      opacity: 0.55;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .code-panel {
      background: var(--code-bg);
      border-radius: 16px;
      padding: 0;
      margin: 40px 0 56px;
      overflow: hidden;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .code-header span {
      color: rgba(255,255,255,0.5);
      font-size: 0.82rem;
    }

    .copy-btn {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8);
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .copy-btn:hover { background: rgba(255,255,255,0.18); }

    .copy-btn:focus-visible {
      outline: 2px solid rgba(255,255,255,0.6);
      outline-offset: 2px;
    }

    .code-body {
      padding: 20px;
      overflow-x: auto;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #e0e0e0;
    }

    .token-selector { color: #c792ea; }
    .token-prop    { color: #82aaff; }
    .token-value   { color: #c3e88d; }
    .token-comment { color: #546e7a; }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .swatch,
      .copy-btn,
      .toast {
        transition: none;
      }
      .swatch:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Color Palette</h1>
      <p>Amber &middot; Cobalt &middot; Jade &mdash; 36 OKLCH tokens (ficha producto)</p>
      <span class="badge" title="Conecta project-figma-console en Cursor para subir la colección brand-colors">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        Listo para Figma (MCP no conectado en esta sesión)
      </span>
    </header>

    <div id="ramps"></div>

    <div class="code-panel">
      <div class="code-header">
        <span>CSS Custom Properties</span>
        <button class="copy-btn" id="copy-btn">Copy</button>
      </div>
      <pre class="code-body" id="code-output"></pre>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">Copied to clipboard</div>

  <script>
    const tokens = {
      amber: [
        { step: 50,  hex: '#FFE667', oklch: 'oklch(0.970 0.162 78)' },
        { step: 100, hex: '#FFCF4D', oklch: 'oklch(0.900 0.162 78)' },
        { step: 150, hex: '#FFB82D', oklch: 'oklch(0.830 0.162 78)' },
        { step: 200, hex: '#E8A200', oklch: 'oklch(0.760 0.162 78)' },
        { step: 250, hex: '#D18B00', oklch: 'oklch(0.690 0.162 78)' },
        { step: 300, hex: '#BA7600', oklch: 'oklch(0.620 0.162 78)' },
        { step: 350, hex: '#A46100', oklch: 'oklch(0.550 0.162 78)' },
        { step: 400, hex: '#8D4C00', oklch: 'oklch(0.480 0.162 78)' },
        { step: 450, hex: '#783700', oklch: 'oklch(0.410 0.162 78)' },
        { step: 500, hex: '#622200', oklch: 'oklch(0.340 0.162 78)' },
        { step: 550, hex: '#4D0B00', oklch: 'oklch(0.270 0.162 78)' },
        { step: 600, hex: '#390000', oklch: 'oklch(0.200 0.162 78)' }
      ],
      cobalt: [
        { step: 50,  hex: '#B3F9FF', oklch: 'oklch(0.970 0.146 256.2)' },
        { step: 100, hex: '#9CE1FF', oklch: 'oklch(0.900 0.146 256.2)' },
        { step: 150, hex: '#86CAFF', oklch: 'oklch(0.830 0.146 256.2)' },
        { step: 200, hex: '#70B3FF', oklch: 'oklch(0.760 0.146 256.2)' },
        { step: 250, hex: '#5B9CF4', oklch: 'oklch(0.690 0.146 256.2)' },
        { step: 300, hex: '#4686DC', oklch: 'oklch(0.620 0.146 256.2)' },
        { step: 350, hex: '#3071C5', oklch: 'oklch(0.550 0.146 256.2)' },
        { step: 400, hex: '#195CAD', oklch: 'oklch(0.480 0.146 256.2)' },
        { step: 450, hex: '#004797', oklch: 'oklch(0.410 0.146 256.2)' },
        { step: 500, hex: '#003281', oklch: 'oklch(0.340 0.146 256.2)' },
        { step: 550, hex: '#001D6B', oklch: 'oklch(0.270 0.146 256.2)' },
        { step: 600, hex: '#000255', oklch: 'oklch(0.200 0.146 256.2)' }
      ],
      jade: [
        { step: 50,  hex: '#A3FFB6', oklch: 'oklch(0.970 0.163 148.3)' },
        { step: 100, hex: '#8BFB9F', oklch: 'oklch(0.900 0.163 148.3)' },
        { step: 150, hex: '#73E489', oklch: 'oklch(0.830 0.163 148.3)' },
        { step: 200, hex: '#5BCD74', oklch: 'oklch(0.760 0.163 148.3)' },
        { step: 250, hex: '#42B65E', oklch: 'oklch(0.690 0.163 148.3)' },
        { step: 300, hex: '#26A049', oklch: 'oklch(0.620 0.163 148.3)' },
        { step: 350, hex: '#008A34', oklch: 'oklch(0.550 0.163 148.3)' },
        { step: 400, hex: '#00741D', oklch: 'oklch(0.480 0.163 148.3)' },
        { step: 450, hex: '#006000', oklch: 'oklch(0.410 0.163 148.3)' },
        { step: 500, hex: '#004B00', oklch: 'oklch(0.340 0.163 148.3)' },
        { step: 550, hex: '#003800', oklch: 'oklch(0.270 0.163 148.3)' },
        { step: 600, hex: '#002400', oklch: 'oklch(0.200 0.163 148.3)' }
      ]
    };

    function textColor(hex) {
      const r = parseInt(hex.slice(1,3),16)/255;
      const g = parseInt(hex.slice(3,5),16)/255;
      const b = parseInt(hex.slice(5,7),16)/255;
      const toL = c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
      const lum = 0.2126*toL(r) + 0.7152*toL(g) + 0.0722*toL(b);
      return lum > 0.35 ? '#1a1a1a' : '#ffffff';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function renderSwatches() {
      const container = document.getElementById('ramps');
      const oklchMeta = {
        amber: 'C 0.162 · H 78°',
        cobalt: 'C 0.146 · H 256.2°',
        jade: 'C 0.163 · H 148.3°'
      };

      for (const [name, steps] of Object.entries(tokens)) {
        const section = document.createElement('div');
        section.className = 'ramp-section';

        const h2 = document.createElement('h2');
        h2.textContent = name;
        section.appendChild(h2);

        const meta = document.createElement('p');
        meta.className = 'ramp-meta';
        meta.textContent = oklchMeta[name];
        section.appendChild(meta);

        const grid = document.createElement('div');
        grid.className = 'swatch-grid';

        for (const s of steps) {
          const tc = textColor(s.hex);
          const el = document.createElement('div');
          el.className = 'swatch';
          el.setAttribute('role', 'button');
          el.setAttribute('tabindex', '0');
          el.setAttribute('aria-label', name + ' ' + s.step + ': ' + s.hex);
          el.style.background = s.hex;
          el.style.color = tc;

          const stepSpan = document.createElement('span');
          stepSpan.className = 'step-num';
          stepSpan.textContent = s.step;
          el.appendChild(stepSpan);

          const hexSpan = document.createElement('span');
          hexSpan.className = 'hex-val';
          hexSpan.textContent = s.hex;
          el.appendChild(hexSpan);

          const oklchSpan = document.createElement('span');
          oklchSpan.className = 'oklch-val';
          oklchSpan.textContent = s.oklch.replace('oklch(','').replace(')','');
          el.appendChild(oklchSpan);

          function copySwatch() {
            navigator.clipboard.writeText(s.hex).then(() => {
              showToast('Copied ' + s.hex);
            }).catch(() => {
              showToast('Could not copy');
            });
          }

          el.addEventListener('click', copySwatch);
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              copySwatch();
            }
          });

          grid.appendChild(el);
        }

        section.appendChild(grid);
        container.appendChild(section);
      }
    }

    function buildCSSBlock() {
      let css = ':root {\n';
      for (const [name, steps] of Object.entries(tokens)) {
        css += `  /* ${name.charAt(0).toUpperCase() + name.slice(1)} */\n`;
        for (const s of steps) {
          css += `  --${name}-${s.step}: ${s.hex}; /* ${s.oklch} */\n`;
        }
        css += '\n';
      }
      css = css.trimEnd() + '\n}';
      return css;
    }

    function renderCode() {
      const raw = buildCSSBlock();
      const highlighted = raw
        .replace(/(:root)/g, '<span class="token-selector">$1</span>')
        .replace(/(\/\*.*?\*\/)/g, '<span class="token-comment">$1</span>')
        .replace(/(--[\w-]+)/g, '<span class="token-prop">$1</span>')
        .replace(/(#[0-9A-Fa-f]{6})/g, '<span class="token-value">$1</span>');
      document.getElementById('code-output').innerHTML = highlighted;
    }

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(buildCSSBlock()).then(() => {
        showToast('CSS copied to clipboard');
      }).catch(() => {
        showToast('Could not copy');
      });
    });

    renderSwatches();
    renderCode();
  </script>
</body>
</html>
