<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Sage · Cornflower · Terracotta</title>
  <style>
    :root {
      /* Sage — oklch(L 0.044 136.7) */
      --sage-50:  #E8FDE0; /* oklch(0.970 0.044 136.7) */
      --sage-100: #D1E5C9; /* oklch(0.900 0.044 136.7) */
      --sage-150: #BACEB2; /* oklch(0.830 0.044 136.7) */
      --sage-200: #A4B89D; /* oklch(0.760 0.044 136.7) */
      --sage-250: #8FA287; /* oklch(0.690 0.044 136.7) */
      --sage-300: #7A8D73; /* oklch(0.620 0.044 136.7) */
      --sage-350: #66785E; /* oklch(0.550 0.044 136.7) */
      --sage-400: #52644B; /* oklch(0.480 0.044 136.7) */
      --sage-450: #3F5038; /* oklch(0.410 0.044 136.7) */
      --sage-500: #2D3D26; /* oklch(0.340 0.044 136.7) */
      --sage-550: #1C2B15; /* oklch(0.270 0.044 136.7) */
      --sage-600: #0C1A06; /* oklch(0.200 0.044 136.7) */

      /* Cornflower — oklch(L 0.092 248.8) */
      --cornflower-50:  #C5FBFF; /* oklch(0.970 0.092 248.8) */
      --cornflower-100: #AEE4FF; /* oklch(0.900 0.092 248.8) */
      --cornflower-150: #98CDFF; /* oklch(0.830 0.092 248.8) */
      --cornflower-200: #82B6E9; /* oklch(0.760 0.092 248.8) */
      --cornflower-250: #6DA0D2; /* oklch(0.690 0.092 248.8) */
      --cornflower-300: #588BBB; /* oklch(0.620 0.092 248.8) */
      --cornflower-350: #4475A5; /* oklch(0.550 0.092 248.8) */
      --cornflower-400: #2F618F; /* oklch(0.480 0.092 248.8) */
      --cornflower-450: #1A4D7A; /* oklch(0.410 0.092 248.8) */
      --cornflower-500: #013A65; /* oklch(0.340 0.092 248.8) */
      --cornflower-550: #002750; /* oklch(0.270 0.092 248.8) */
      --cornflower-600: #00143D; /* oklch(0.200 0.092 248.8) */

      /* Terracotta — oklch(L 0.106 41.7) */
      --terracotta-50:  #FFDEBD; /* oklch(0.970 0.106 41.7) */
      --terracotta-100: #FFC7A7; /* oklch(0.900 0.106 41.7) */
      --terracotta-150: #FFB091; /* oklch(0.830 0.106 41.7) */
      --terracotta-200: #EA9A7B; /* oklch(0.760 0.106 41.7) */
      --terracotta-250: #D38466; /* oklch(0.690 0.106 41.7) */
      --terracotta-300: #BC6F52; /* oklch(0.620 0.106 41.7) */
      --terracotta-350: #A55B3E; /* oklch(0.550 0.106 41.7) */
      --terracotta-400: #8E462A; /* oklch(0.480 0.106 41.7) */
      --terracotta-450: #783215; /* oklch(0.410 0.106 41.7) */
      --terracotta-500: #621E00; /* oklch(0.340 0.106 41.7) */
      --terracotta-550: #4D0800; /* oklch(0.270 0.106 41.7) */
      --terracotta-600: #380000; /* oklch(0.200 0.106 41.7) */

      --bg:      #f9f9f8;
      --surface: #ffffff;
      --text:    #1a1a1a;
      --muted:   #6b6b6b;
      --border:  #e5e5e3;
      --code-bg: #1a1a1a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      padding: 56px 0 40px;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    header p {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .badge svg {
      width: 14px;
      height: 14px;
    }

    .ramp-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 28px 24px;
      margin-bottom: 24px;
    }

    .ramp-section h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
      text-transform: capitalize;
    }

    .ramp-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 18px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
    }

    @media (max-width: 700px) {
      .swatch-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    .swatch {
      cursor: pointer;
      border-radius: 10px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      position: relative;
    }

    .swatch:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      z-index: 2;
    }

    .swatch:active { transform: scale(0.97); }

    .swatch:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    .swatch .step-num {
      font-size: 0.72rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .swatch .hex-val {
      font-size: 0.58rem;
      opacity: 0.75;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .swatch .oklch-val {
      font-size: 0.48rem;
      opacity: 0.55;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .code-panel {
      background: var(--code-bg);
      border-radius: 16px;
      padding: 0;
      margin: 40px 0 56px;
      overflow: hidden;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .code-header span {
      color: rgba(255,255,255,0.5);
      font-size: 0.82rem;
    }

    .copy-btn {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8);
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .copy-btn:hover { background: rgba(255,255,255,0.18); }

    .copy-btn:focus-visible {
      outline: 2px solid rgba(255,255,255,0.6);
      outline-offset: 2px;
    }

    .code-body {
      padding: 20px;
      overflow-x: auto;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #e0e0e0;
    }

    .token-selector { color: #c792ea; }
    .token-prop    { color: #82aaff; }
    .token-value   { color: #c3e88d; }
    .token-comment { color: #546e7a; }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .swatch,
      .copy-btn,
      .toast {
        transition: none;
      }
      .swatch:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Color Palette</h1>
      <p>Sage &middot; Cornflower &middot; Terracotta &mdash; 36 OKLCH tokens</p>
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        Exported from Figma
      </span>
    </header>

    <div id="ramps"></div>

    <div class="code-panel">
      <div class="code-header">
        <span>CSS Custom Properties</span>
        <button class="copy-btn" id="copy-btn">Copy</button>
      </div>
      <pre class="code-body" id="code-output"></pre>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">Copied to clipboard</div>

  <script>
    const tokens = {
      sage: [
        { step: 50,  hex: '#E8FDE0', oklch: 'oklch(0.970 0.044 136.7)' },
        { step: 100, hex: '#D1E5C9', oklch: 'oklch(0.900 0.044 136.7)' },
        { step: 150, hex: '#BACEB2', oklch: 'oklch(0.830 0.044 136.7)' },
        { step: 200, hex: '#A4B89D', oklch: 'oklch(0.760 0.044 136.7)' },
        { step: 250, hex: '#8FA287', oklch: 'oklch(0.690 0.044 136.7)' },
        { step: 300, hex: '#7A8D73', oklch: 'oklch(0.620 0.044 136.7)' },
        { step: 350, hex: '#66785E', oklch: 'oklch(0.550 0.044 136.7)' },
        { step: 400, hex: '#52644B', oklch: 'oklch(0.480 0.044 136.7)' },
        { step: 450, hex: '#3F5038', oklch: 'oklch(0.410 0.044 136.7)' },
        { step: 500, hex: '#2D3D26', oklch: 'oklch(0.340 0.044 136.7)' },
        { step: 550, hex: '#1C2B15', oklch: 'oklch(0.270 0.044 136.7)' },
        { step: 600, hex: '#0C1A06', oklch: 'oklch(0.200 0.044 136.7)' }
      ],
      cornflower: [
        { step: 50,  hex: '#C5FBFF', oklch: 'oklch(0.970 0.092 248.8)' },
        { step: 100, hex: '#AEE4FF', oklch: 'oklch(0.900 0.092 248.8)' },
        { step: 150, hex: '#98CDFF', oklch: 'oklch(0.830 0.092 248.8)' },
        { step: 200, hex: '#82B6E9', oklch: 'oklch(0.760 0.092 248.8)' },
        { step: 250, hex: '#6DA0D2', oklch: 'oklch(0.690 0.092 248.8)' },
        { step: 300, hex: '#588BBB', oklch: 'oklch(0.620 0.092 248.8)' },
        { step: 350, hex: '#4475A5', oklch: 'oklch(0.550 0.092 248.8)' },
        { step: 400, hex: '#2F618F', oklch: 'oklch(0.480 0.092 248.8)' },
        { step: 450, hex: '#1A4D7A', oklch: 'oklch(0.410 0.092 248.8)' },
        { step: 500, hex: '#013A65', oklch: 'oklch(0.340 0.092 248.8)' },
        { step: 550, hex: '#002750', oklch: 'oklch(0.270 0.092 248.8)' },
        { step: 600, hex: '#00143D', oklch: 'oklch(0.200 0.092 248.8)' }
      ],
      terracotta: [
        { step: 50,  hex: '#FFDEBD', oklch: 'oklch(0.970 0.106 41.7)' },
        { step: 100, hex: '#FFC7A7', oklch: 'oklch(0.900 0.106 41.7)' },
        { step: 150, hex: '#FFB091', oklch: 'oklch(0.830 0.106 41.7)' },
        { step: 200, hex: '#EA9A7B', oklch: 'oklch(0.760 0.106 41.7)' },
        { step: 250, hex: '#D38466', oklch: 'oklch(0.690 0.106 41.7)' },
        { step: 300, hex: '#BC6F52', oklch: 'oklch(0.620 0.106 41.7)' },
        { step: 350, hex: '#A55B3E', oklch: 'oklch(0.550 0.106 41.7)' },
        { step: 400, hex: '#8E462A', oklch: 'oklch(0.480 0.106 41.7)' },
        { step: 450, hex: '#783215', oklch: 'oklch(0.410 0.106 41.7)' },
        { step: 500, hex: '#621E00', oklch: 'oklch(0.340 0.106 41.7)' },
        { step: 550, hex: '#4D0800', oklch: 'oklch(0.270 0.106 41.7)' },
        { step: 600, hex: '#380000', oklch: 'oklch(0.200 0.106 41.7)' }
      ]
    };

    function textColor(hex) {
      const r = parseInt(hex.slice(1,3),16)/255;
      const g = parseInt(hex.slice(3,5),16)/255;
      const b = parseInt(hex.slice(5,7),16)/255;
      const toL = c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
      const lum = 0.2126*toL(r) + 0.7152*toL(g) + 0.0722*toL(b);
      return lum > 0.35 ? '#1a1a1a' : '#ffffff';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function renderSwatches() {
      const container = document.getElementById('ramps');
      const oklchMeta = {
        sage: 'C 0.044 · H 136.7°',
        cornflower: 'C 0.092 · H 248.8°',
        terracotta: 'C 0.106 · H 41.7°'
      };

      for (const [name, steps] of Object.entries(tokens)) {
        const section = document.createElement('div');
        section.className = 'ramp-section';

        const h2 = document.createElement('h2');
        h2.textContent = name;
        section.appendChild(h2);

        const meta = document.createElement('p');
        meta.className = 'ramp-meta';
        meta.textContent = oklchMeta[name];
        section.appendChild(meta);

        const grid = document.createElement('div');
        grid.className = 'swatch-grid';

        for (const s of steps) {
          const tc = textColor(s.hex);
          const el = document.createElement('div');
          el.className = 'swatch';
          el.setAttribute('role', 'button');
          el.setAttribute('tabindex', '0');
          el.setAttribute('aria-label', name + ' ' + s.step + ': ' + s.hex);
          el.style.background = s.hex;
          el.style.color = tc;

          const stepSpan = document.createElement('span');
          stepSpan.className = 'step-num';
          stepSpan.textContent = s.step;
          el.appendChild(stepSpan);

          const hexSpan = document.createElement('span');
          hexSpan.className = 'hex-val';
          hexSpan.textContent = s.hex;
          el.appendChild(hexSpan);

          const oklchSpan = document.createElement('span');
          oklchSpan.className = 'oklch-val';
          oklchSpan.textContent = s.oklch.replace('oklch(','').replace(')','');
          el.appendChild(oklchSpan);

          function copySwatch() {
            navigator.clipboard.writeText(s.hex).then(() => {
              showToast('Copied ' + s.hex);
            }).catch(() => {
              showToast('Could not copy');
            });
          }

          el.addEventListener('click', copySwatch);
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              copySwatch();
            }
          });

          grid.appendChild(el);
        }

        section.appendChild(grid);
        container.appendChild(section);
      }
    }

    function buildCSSBlock() {
      let css = ':root {\n';
      for (const [name, steps] of Object.entries(tokens)) {
        css += `  /* ${name.charAt(0).toUpperCase() + name.slice(1)} */\n`;
        for (const s of steps) {
          css += `  --${name}-${s.step}: ${s.hex}; /* ${s.oklch} */\n`;
        }
        css += '\n';
      }
      css = css.trimEnd() + '\n}';
      return css;
    }

    function renderCode() {
      const raw = buildCSSBlock();
      const highlighted = raw
        .replace(/(:root)/g, '<span class="token-selector">$1</span>')
        .replace(/(\/\*.*?\*\/)/g, '<span class="token-comment">$1</span>')
        .replace(/(--[\w-]+)/g, '<span class="token-prop">$1</span>')
        .replace(/(#[0-9A-Fa-f]{6})/g, '<span class="token-value">$1</span>');
      document.getElementById('code-output').innerHTML = highlighted;
    }

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(buildCSSBlock()).then(() => {
        showToast('CSS copied to clipboard');
      }).catch(() => {
        showToast('Could not copy');
      });
    });

    renderSwatches();
    renderCode();
  </script>
</body>
</html>
